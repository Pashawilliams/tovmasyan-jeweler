<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Golden diamond jewelry artwork</title>
  <desc id="desc">Decorative golden jewelry illustration for TOVMASYAN Jeweler website.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="58%"><stop stop-color="#ffdfa2" stop-opacity=".55"/><stop offset=".32" stop-color="#c8842f" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6e3c13"/><stop offset=".16" stop-color="#ffefbd"/><stop offset=".32" stop-color="#c98d31"/><stop offset=".54" stop-color="#fff5ce"/><stop offset=".75" stop-color="#a9611d"/><stop offset="1" stop-color="#f3be64"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#251609"/><stop offset="1" stop-color="#070402"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 1  0 .7 0 0 .55  0 0 .25 0 .1  0 0 0 .8 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="900" height="700" fill="none"/>
  <ellipse cx="452" cy="356" rx="390" ry="300" fill="url(#halo)"/>
  <ellipse cx="455" cy="606" rx="260" ry="38" fill="#000" opacity=".5" filter="url(#soft)"/>

