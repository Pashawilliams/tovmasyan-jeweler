<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Курс золота — табло</title><style>:root {
  --bg: #f6f4f0;
  --bg-2: #ffffff;
  --panel: rgba(255, 255, 255, 0.86);
  --panel-strong: #ffffff;
  --line: rgba(23, 19, 16, 0.12);
  --line-strong: rgba(166, 124, 45, 0.45);
  --gold: #a87c2d;
  --gold-2: #8a6420;
  --gold-3: #6f4d15;
  --text: #171310;
  --muted: rgba(23, 19, 16, 0.72);
  --muted-2: rgba(23, 19, 16, 0.52);
  --black: #171310;
  --radius-lg: 34px;
  --radius-md: 24px;
  --radius-sm: 16px;
  --max: 1180px;
  --shadow: 0 20px 50px rgba(23, 19, 16, 0.10);
  --gold-gradient: linear-gradient(135deg, #8a551a 0%, #ffefbd 16%, #c98d31 36%, #fff2c6 52%, #a8631d 72%, #f5bd65 100%);
  --glass-gradient: linear-gradient(135deg, rgba(23, 19, 16, 0.05), rgba(23, 19, 16, 0.015));
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 18% 8%, rgba(166, 124, 45, 0.13), transparent 28rem),
    radial-gradient(circle at 82% 18%, rgba(166, 124, 45, 0.1), transparent 26rem),
    radial-gradient(circle at 50% 100%, rgba(166, 124, 45, 0.16), transparent 34rem),
    var(--bg);
  overflow-x: hidden;
}

body::before,
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -2;
}

body::before {
  background:
    linear-gradient(116deg, transparent 0 11%, rgba(166, 124, 45, 0.06) 11.4%, transparent 12.2% 45%, rgba(166, 124, 45, 0.07) 45.4%, transparent 46.2% 100%),
    linear-gradient(38deg, transparent 0 22%, rgba(166, 124, 45, 0.045) 22.3%, transparent 23.2% 58%, rgba(166, 124, 45, 0.055) 58.3%, transparent 59.2% 100%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.039), transparent 17rem);
  opacity: .88;
}

body::after {
  z-index: -1;
  opacity: .16;
  background-image:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.088) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.055) 0 1px, transparent 1px 4px);
  mix-blend-mode: overlay;
}

img,
svg {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

::selection {
  background: rgba(166, 124, 45, 0.35);
  color: #171310;
}

.skip-link {
  position: fixed;
  left: 16px;
  top: 16px;
  z-index: 9999;
  transform: translateY(-140%);
  padding: 12px 16px;
  border-radius: 999px;
  background: #ffffff;
  border: 1px solid var(--line-strong);
  transition: transform .2s ease;
}

.skip-link:focus {
  transform: translateY(0);
}

.container {
  width: min(var(--max), calc(100% - 40px));
  margin-inline: auto;
}

.page-glow {
  position: fixed;
  inset: auto auto -180px -140px;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(240, 178, 79, .16), transparent 68%);
  pointer-events: none;
  z-index: -1;
}

.cursor-glow {
  position: fixed;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 220, 157, .12), transparent 62%);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: opacity .25s ease;
}

body.has-cursor .cursor-glow {
  opacity: 1;
}

.site-header {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  width: min(var(--max), calc(100% - 32px));
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 10px 12px 10px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.66);
  box-shadow: 0 18px 70px rgba(23, 19, 16, 0.147);
  backdrop-filter: blur(22px);
  transition: top .3s ease, background .3s ease, border-color .3s ease, box-shadow .3s ease;
}

body.is-scrolled .site-header {
  top: 8px;
  background: rgba(255, 255, 255, 0.88);
  border-color: rgba(166, 124, 45, 0.34);
  box-shadow: 0 16px 60px rgba(23, 19, 16, 0.218);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-width: max-content;
}

.brand__logo {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(255, 224, 160, .25), 0 0 28px rgba(219, 156, 60, .22);
}

.brand__text {
  display: grid;
  line-height: 1.05;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-weight: 800;
}

.brand__text small {
  margin-top: 3px;
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 500;
  color: var(--gold-2);
  letter-spacing: .24em;
  font-size: .68rem;
}

.main-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.039);
  border: 1px solid rgba(23, 19, 16, 0.055);
}

.main-nav a {
  position: relative;
  padding: 10px 13px;
  border-radius: 999px;
  color: var(--muted);
  font-size: .92rem;
  transition: color .2s ease, background .2s ease;
}

.main-nav a:hover,
.main-nav a:focus-visible {
  color: var(--text);
  background: rgba(255, 220, 145, .08);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-link {
  color: var(--muted);
  font-size: .9rem;
  padding: 10px 8px;
  transition: color .2s ease;
}

.icon-link:hover {
  color: var(--gold-2);
}

.menu-toggle {
  display: none;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.044);
  color: var(--text);
  align-items: center;
  justify-content: center;
  gap: 5px;
  flex-direction: column;
}

.menu-toggle span {
  width: 18px;
  height: 2px;
  border-radius: 999px;
  background: var(--gold-2);
  transition: transform .25s ease, opacity .25s ease;
}

.menu-toggle.is-open span:first-child {
  transform: translateY(3.5px) rotate(45deg);
}

.menu-toggle.is-open span:last-child {
  transform: translateY(-3.5px) rotate(-45deg);
}

.btn {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 50px;
  padding: 0 22px;
  border-radius: 999px;
  border: 1px solid rgba(166, 124, 45, 0.32);
  overflow: hidden;
  font-weight: 750;
  letter-spacing: .01em;
  transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
}

.btn::before {
  content: "";
  position: absolute;
  inset: -2px;
  z-index: -1;
  background: linear-gradient(105deg, transparent 0 36%, rgba(255, 255, 255, 0.14) 46%, transparent 57% 100%);
  transform: translateX(-120%);
  transition: transform .75s ease;
}

.btn:hover,
.btn:focus-visible {
  transform: translateY(-2px);
}

.btn:hover::before,
.btn:focus-visible::before {
  transform: translateX(120%);
}

.btn--small {
  min-height: 44px;
  padding-inline: 17px;
  font-size: .92rem;
}

.btn--gold {
  color: #160d05;
  background: var(--gold-gradient);
  box-shadow: 0 13px 34px rgba(211, 151, 55, .20), inset 0 1px 0 rgba(23, 19, 16, 0.58);
}

.btn--glass {
  color: var(--text);
  background: rgba(255, 255, 255, 0.061);
  box-shadow: inset 0 1px 0 rgba(23, 19, 16, 0.088);
}

.btn--glass:hover,
.btn--glass:focus-visible {
  border-color: rgba(166, 124, 45, 0.56);
  box-shadow: 0 12px 38px rgba(23, 19, 16, 0.118), inset 0 1px 0 rgba(23, 19, 16, 0.121);
}

.hero {
  position: relative;
  min-height: 100svh;
  display: flex;
  align-items: center;
  padding: 142px 0 84px;
  overflow: hidden;
}

.hero__marble {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 55% 46%, rgba(216, 155, 60, .16), transparent 28rem),
    linear-gradient(121deg, transparent 0 32%, rgba(255, 231, 178, .06) 32.25%, transparent 33.2% 100%),
    linear-gradient(26deg, transparent 0 54%, rgba(169, 96, 30, .08) 54.25%, transparent 55.2% 100%);
  opacity: .8;
}

.hero__inner {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 520px);
  align-items: center;
  gap: 58px;
}

.eyebrow {
  margin: 0 0 16px;
  color: var(--gold-2);
  text-transform: uppercase;
  letter-spacing: .26em;
  font-size: .76rem;
  font-weight: 800;
}

.hero h1,
.section-head h2,
.atelier-card h2,
.about-content h2,
.faq-intro h2,
.contact-info h2 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 700;
  letter-spacing: -.045em;
  line-height: .96;
}

.hero h1 {
  max-width: 780px;
  font-size: clamp(3.3rem, 7vw, 7.5rem);
  background: linear-gradient(110deg, #2e2008 0%, #8a6420 38%, #c08f38 62%, #6f4d15 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 20px 70px rgba(226, 163, 69, .12);
}

.hero__lead {
  width: min(650px, 100%);
  margin: 26px 0 0;
  color: var(--muted);
  font-size: clamp(1rem, 1.65vw, 1.22rem);
  line-height: 1.8;
}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 34px;
}

.hero__facts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 38px;
  width: min(720px, 100%);
}

.hero__facts div {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.039);
  box-shadow: inset 0 1px 0 rgba(23, 19, 16, 0.044);
}

.hero__facts strong {
  display: block;
  font-family: Georgia, "Times New Roman", serif;
  color: var(--gold-2);
  font-size: 1.15rem;
}

.hero__facts span {
  display: block;
  margin-top: 7px;
  color: var(--muted-2);
  font-size: .9rem;
  line-height: 1.45;
}

.hero__visual {
  position: relative;
  min-height: 630px;
  display: grid;
  place-items: center;
  border-radius: 42px;
  border: 1px solid rgba(166, 124, 45, 0.28);
  background:
    radial-gradient(circle at 50% 36%, rgba(166, 124, 45, 0.18), transparent 22rem),
    linear-gradient(145deg, rgba(255, 255, 255, 0.077), rgba(255, 255, 255, 0.017));
  box-shadow: var(--shadow), inset 0 1px 0 rgba(23, 19, 16, 0.088);
  overflow: hidden;
}

.hero__visual::before,
.hero__visual::after {
  content: "";
  position: absolute;
  border-radius: 999px;
  pointer-events: none;
}

.hero__visual::before {
  width: 84%;
  height: 84%;
  border: 1px solid rgba(255, 226, 167, .16);
  box-shadow: inset 0 0 80px rgba(255, 199, 98, .07);
}

.hero__visual::after {
  inset: auto -30% -32% -30%;
  height: 45%;
  background: radial-gradient(ellipse, rgba(255, 255, 255, 0.302), transparent 60%);
}

.hero__logo {
  position: absolute;
  top: 36px;
  width: 168px;
  height: 168px;
  border-radius: 50%;
  filter: drop-shadow(0 18px 34px rgba(23, 19, 16, 0.176)) drop-shadow(0 0 24px rgba(219, 154, 54, .18));
  opacity: .98;
}

.hero__jewel {
  position: relative;
  width: min(92%, 560px);
  margin-top: 58px;
  filter: drop-shadow(0 26px 46px rgba(23, 19, 16, 0.244));
  animation: float 5.8s ease-in-out infinite;
}

.orbit {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255, 221, 156, .22);
  filter: drop-shadow(0 0 18px rgba(222, 159, 59, .2));
}

.orbit--one {
  width: 480px;
  height: 480px;
  animation: rotate 28s linear infinite;
}

.orbit--two {
  width: 360px;
  height: 360px;
  border-style: dashed;
  opacity: .62;
  animation: rotate 22s linear infinite reverse;
}

.floating-card {
  position: absolute;
  z-index: 3;
  width: min(250px, calc(100% - 34px));
  padding: 16px 18px;
  border: 1px solid rgba(255, 221, 156, .28);
  border-radius: 20px;
  background: rgba(255, 255, 255, .74);
  backdrop-filter: blur(18px);
  box-shadow: 0 20px 48px rgba(23, 19, 16, 0.143), inset 0 1px 0 rgba(23, 19, 16, 0.066);
}

.floating-card span {
  display: block;
  color: var(--muted-2);
  font-size: .82rem;
}

.floating-card strong {
  display: block;
  margin-top: 5px;
  color: var(--gold-2);
  line-height: 1.35;
}

.floating-card--top {
  left: 24px;
  top: 236px;
}

.floating-card--bottom {
  right: 24px;
  bottom: 44px;
}

.sparkles span {
  position: absolute;
  z-index: 1;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #ffe8af;
  box-shadow: 0 0 20px 6px rgba(255, 210, 130, .42);
  opacity: .65;
  animation: sparkle 3.7s ease-in-out infinite;
}

.sparkles span:nth-child(1) { left: 12%; top: 22%; animation-delay: .2s; }
.sparkles span:nth-child(2) { left: 71%; top: 18%; animation-delay: 1.1s; }
.sparkles span:nth-child(3) { left: 86%; top: 46%; animation-delay: .7s; }
.sparkles span:nth-child(4) { left: 24%; top: 72%; animation-delay: 1.8s; }
.sparkles span:nth-child(5) { left: 57%; top: 78%; animation-delay: .4s; }
.sparkles span:nth-child(6) { left: 42%; top: 16%; animation-delay: 2.2s; }

.signature-strip {
  position: relative;
  z-index: 3;
  margin-top: -48px;
  padding-bottom: 38px;
}

.signature-strip__grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.signature-strip article,
.trust-card {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72);
  border-radius: var(--radius-md);
  padding: 26px;
  box-shadow: 0 18px 54px rgba(23, 19, 16, 0.109), inset 0 1px 0 rgba(23, 19, 16, 0.055);
  backdrop-filter: blur(18px);
}

.strip-icon,
.trust-card span {
  display: inline-grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 50%;
  color: #170e05;
  background: var(--gold-gradient);
  box-shadow: 0 0 24px rgba(220, 159, 64, .22);
  font-weight: 900;
}

.signature-strip h2,
.trust-card h3 {
  margin: 18px 0 8px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.42rem;
}

.signature-strip p,
.trust-card p {
  margin: 0;
  color: var(--muted);
  line-height: 1.7;
}

.section {
  position: relative;
  padding: 104px 0;
}

.section-head {
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(260px, .55fr);
  align-items: end;
  gap: 36px;
  margin-bottom: 40px;
}

.section-head--center {
  max-width: 810px;
  margin-inline: auto;
  text-align: center;
  grid-template-columns: 1fr;
  gap: 0;
}

.section-head h2,
.atelier-card h2,
.about-content h2,
.faq-intro h2,
.contact-info h2 {
  font-size: clamp(2.35rem, 4.2vw, 4.6rem);
  background: linear-gradient(110deg, #2e2008 0%, #8a6420 38%, #c08f38 62%, #6f4d15 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.section-head p:last-child,
.atelier-card__content > p,
.about-content > p,
.faq-intro p,
.contact-info > p {
  margin: 0;
  color: var(--muted);
  line-height: 1.8;
  font-size: 1.04rem;
}

.collections-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.collection-card {
  position: relative;
  min-height: 386px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.066), rgba(255, 255, 255, 0.022)),
    rgba(255, 255, 255, 0.82);
  overflow: hidden;
  box-shadow: 0 18px 60px rgba(23, 19, 16, 0.118), inset 0 1px 0 rgba(23, 19, 16, 0.055);
  transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease;
}

.collection-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 32%, rgba(166, 124, 45, 0.18), transparent 22rem);
  opacity: .8;
  transition: opacity .35s ease;
}

.collection-card::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 58%;
  background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.82) 70%);
}

.collection-card:hover,
.collection-card:focus-visible {
  transform: translateY(-8px);
  border-color: rgba(166, 124, 45, 0.54);
  box-shadow: 0 26px 80px rgba(23, 19, 16, 0.16), 0 0 0 1px rgba(166, 124, 45, 0.12) inset;
}

.collection-card img {
  position: absolute;
  inset: 16px 16px auto;
  width: calc(100% - 32px);
  height: 245px;
  object-fit: cover;
  border-radius: 28px;
  opacity: .92;
  transform: scale(1.02);
  transition: transform .45s ease, opacity .35s ease;
}

.collection-card:hover img,
.collection-card:focus-visible img {
  transform: scale(1.07);
  opacity: 1;
}

.collection-card__number,
.collection-card h3,
.collection-card p {
  position: relative;
  z-index: 2;
}

.collection-card__number {
  width: max-content;
  padding: 7px 10px;
  border: 1px solid rgba(166, 124, 45, 0.28);
  border-radius: 999px;
  color: var(--gold-2);
  font-size: .78rem;
  letter-spacing: .18em;
}

.collection-card h3 {
  margin: 14px 0 8px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 2rem;
}

.collection-card p {
  margin: 0;
  color: var(--muted);
  line-height: 1.65;
}

.products-section {
  padding-top: 72px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 0 auto 34px;
}

.filter-chip {
  min-height: 44px;
  padding: 0 17px;
  border-radius: 999px;
  border: 1px solid rgba(166, 124, 45, 0.22);
  color: var(--muted);
  background: rgba(255, 255, 255, 0.039);
  transition: color .2s ease, background .2s ease, border-color .2s ease, transform .2s ease;
}

.filter-chip:hover,
.filter-chip:focus-visible,
.filter-chip.is-active {
  color: #150c04;
  background: var(--gold-gradient);
  border-color: transparent;
  transform: translateY(-1px);
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.product-card {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .82);
  overflow: hidden;
  box-shadow: 0 18px 60px rgba(23, 19, 16, 0.105), inset 0 1px 0 rgba(23, 19, 16, 0.055);
  transition: transform .3s ease, opacity .3s ease, border-color .3s ease;
}

.product-card:hover {
  transform: translateY(-7px);
  border-color: rgba(166, 124, 45, 0.48);
}

.product-card.is-hidden {
  display: none;
}

.product-card__media {
  position: relative;
  aspect-ratio: 1.22 / .92;
  overflow: hidden;
  border-bottom: 1px solid rgba(166, 124, 45, 0.14);
  background: #ffffff;
}

.product-card__media::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 0 38%, rgba(255, 255, 255, 0.14) 48%, transparent 58% 100%);
  transform: translateX(-120%);
  transition: transform .8s ease;
}

.product-card:hover .product-card__media::after {
  transform: translateX(120%);
}

.product-card__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .5s ease;
}

.product-card:hover .product-card__media img {
  transform: scale(1.05);
}

.product-card__body {
  display: flex;
  flex: 1;
  flex-direction: column;
  padding: 22px;
}

.product-card__tag {
  width: max-content;
  padding: 7px 10px;
  border-radius: 999px;
  border: 1px solid rgba(166, 124, 45, 0.18);
  color: var(--gold-2);
  background: rgba(166, 124, 45, 0.045);
  font-size: .75rem;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.product-card h3 {
  margin: 18px 0 9px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.68rem;
}

.product-card p {
  margin: 0 0 24px;
  color: var(--muted);
  line-height: 1.7;
}

.product-card__bottom {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding-top: 18px;
  border-top: 1px solid rgba(23, 19, 16, 0.066);
}

.product-card__bottom span {
  color: var(--gold-2);
  font-weight: 800;
}

.order-link {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  padding: 0 14px;
  border-radius: 999px;
  color: #160d05;
  background: var(--gold-gradient);
  font-weight: 800;
  font-size: .9rem;
}

.atelier-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, .9fr) minmax(320px, .72fr);
  gap: 46px;
  align-items: center;
  padding: clamp(28px, 5vw, 64px);
  border-radius: 44px;
  border: 1px solid rgba(166, 124, 45, 0.28);
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 215, 139, .16), transparent 23rem),
    radial-gradient(circle at 83% 50%, rgba(194, 115, 33, .14), transparent 22rem),
    linear-gradient(135deg, rgba(255, 255, 255, 0.088), rgba(255, 255, 255, 0.022));
  box-shadow: var(--shadow), inset 0 1px 0 rgba(23, 19, 16, 0.077);
  overflow: hidden;
}

.atelier-card::before {
  content: "";
  position: absolute;
  inset: 28px;
  border: 1px solid rgba(166, 124, 45, 0.12);
  border-radius: 34px;
  pointer-events: none;
}

.atelier-card__content,
.process-list {
  position: relative;
  z-index: 2;
}

.atelier-card__content > p {
  margin: 22px 0 30px;
}

.process-list {
  display: grid;
  gap: 14px;
}

.process-item {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 16px;
  align-items: start;
  padding: 18px;
  border-radius: 22px;
  border: 1px solid rgba(166, 124, 45, 0.18);
  background: rgba(255, 255, 255, 0.092);
}

.process-item > span {
  display: grid;
  width: 52px;
  height: 52px;
  place-items: center;
  border-radius: 50%;
  color: #160d05;
  background: var(--gold-gradient);
  font-weight: 900;
}

.process-item h3 {
  margin: 0 0 6px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.25rem;
}

.process-item p {
  margin: 0;
  color: var(--muted);
  line-height: 1.6;
}

.about-grid {
  display: grid;
  grid-template-columns: minmax(320px, .78fr) minmax(0, 1fr);
  gap: 54px;
  align-items: center;
}

.about-visual {
  position: relative;
}

.about-visual__frame {
  display: grid;
  place-items: center;
  min-height: 560px;
  border-radius: 44px;
  border: 1px solid var(--line);
  background:
    radial-gradient(circle at 50% 40%, rgba(255, 215, 139, .18), transparent 18rem),
    rgba(255, 255, 255, .82);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(23, 19, 16, 0.066);
  overflow: hidden;
}

.about-visual__frame img {
  width: min(82%, 430px);
  border-radius: 50%;
  filter: drop-shadow(0 22px 50px rgba(23, 19, 16, 0.244));
}

.about-note {
  position: absolute;
  right: -18px;
  bottom: 34px;
  width: min(330px, calc(100% - 28px));
  padding: 18px 20px;
  border-radius: 22px;
  border: 1px solid rgba(166, 124, 45, 0.25);
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(16px);
  box-shadow: 0 20px 46px rgba(23, 19, 16, 0.147);
}

.about-note strong,
.about-note span {
  display: block;
}

.about-note strong {
  color: var(--gold-2);
  margin-bottom: 5px;
}

.about-note span {
  color: var(--muted);
  line-height: 1.5;
}

.about-content > p {
  margin: 22px 0 30px;
}

.values-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.values-grid div {
  padding: 20px;
  border-radius: 22px;
  border: 1px solid rgba(166, 124, 45, 0.18);
  background: rgba(255, 255, 255, 0.039);
}

.values-grid span {
  color: var(--gold-2);
  font-weight: 900;
  letter-spacing: .15em;
  font-size: .78rem;
}

.values-grid h3 {
  margin: 12px 0 8px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.2rem;
}

.values-grid p {
  margin: 0;
  color: var(--muted);
  line-height: 1.6;
}

.trust-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.faq-grid {
  display: grid;
  grid-template-columns: minmax(270px, .55fr) minmax(0, 1fr);
  gap: 44px;
  align-items: start;
}

.faq-list {
  display: grid;
  gap: 12px;
}

details {
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.74);
  overflow: hidden;
}

summary {
  list-style: none;
  cursor: pointer;
  position: relative;
  padding: 22px 58px 22px 22px;
  color: var(--text);
  font-weight: 800;
}

summary::-webkit-details-marker {
  display: none;
}

summary::after {
  content: "+";
  position: absolute;
  right: 22px;
  top: 50%;
  transform: translateY(-50%);
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #160d05;
  background: var(--gold-gradient);
}

details[open] summary::after {
  content: "−";
}

details p {
  margin: 0;
  padding: 0 22px 22px;
  color: var(--muted);
  line-height: 1.7;
}

.contact-card {
  display: grid;
  grid-template-columns: minmax(0, .9fr) minmax(320px, .62fr);
  gap: 34px;
  padding: clamp(24px, 4vw, 48px);
  border-radius: 44px;
  border: 1px solid rgba(166, 124, 45, 0.28);
  background:
    radial-gradient(circle at 24% 20%, rgba(255, 215, 139, .14), transparent 22rem),
    linear-gradient(135deg, rgba(255, 255, 255, 0.077), rgba(255, 255, 255, 0.022));
  box-shadow: var(--shadow), inset 0 1px 0 rgba(23, 19, 16, 0.077);
}

.contact-info > p {
  margin: 22px 0 28px;
}

.contact-methods {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.contact-methods a {
  min-height: 112px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 18px;
  border-radius: 22px;
  border: 1px solid rgba(166, 124, 45, 0.18);
  background: rgba(255, 255, 255, 0.092);
  transition: transform .25s ease, border-color .25s ease, background .25s ease;
}

.contact-methods a:hover,
.contact-methods a:focus-visible {
  transform: translateY(-4px);
  border-color: rgba(166, 124, 45, 0.46);
  background: rgba(166, 124, 45, 0.055);
}

.contact-methods span {
  margin-bottom: 8px;
  color: var(--muted-2);
  font-size: .86rem;
}

.contact-methods strong {
  color: var(--gold-2);
  line-height: 1.42;
}

.order-form {
  padding: 24px;
  border: 1px solid rgba(166, 124, 45, 0.22);
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.32);
}

.order-form h3 {
  margin: 0 0 8px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.8rem;
}

.order-form p {
  margin: 0 0 20px;
  color: var(--muted);
  line-height: 1.6;
}

.order-form label {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
  color: var(--gold-2);
  font-weight: 760;
}

.order-form input,
.order-form select,
.order-form textarea {
  width: 100%;
  border: 1px solid rgba(166, 124, 45, 0.22);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.061);
  color: var(--text);
  padding: 14px 15px;
  outline: none;
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

.order-form select option {
  color: #1b1108;
}

.order-form textarea {
  resize: vertical;
  min-height: 116px;
}

.order-form input:focus,
.order-form select:focus,
.order-form textarea:focus {
  border-color: rgba(166, 124, 45, 0.62);
  box-shadow: 0 0 0 4px rgba(166, 124, 45, 0.1);
  background: rgba(255, 255, 255, 0.083);
}

.order-form .btn {
  width: 100%;
  margin-top: 8px;
}

.site-footer {
  border-top: 1px solid rgba(166, 124, 45, 0.14);
  background: rgba(255, 255, 255, 0.54);
  padding: 42px 0 28px;
}

.footer-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 24px;
  align-items: center;
}

.footer-brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-weight: 900;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.footer-brand img {
  width: 58px;
  height: 58px;
  border-radius: 50%;
}

.footer-grid p {
  margin: 0;
  color: var(--muted);
  line-height: 1.7;
  text-align: center;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 10px 16px;
}

.footer-links a {
  color: var(--muted);
  transition: color .2s ease;
}

.footer-links a:hover {
  color: var(--gold-2);
}

.footer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-top: 32px;
  padding-top: 22px;
  border-top: 1px solid rgba(23, 19, 16, 0.077);
  color: var(--muted-2);
  font-size: .9rem;
}

.floating-whatsapp {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 900;
  display: inline-flex;
  min-height: 52px;
  align-items: center;
  justify-content: center;
  padding: 0 20px;
  border-radius: 999px;
  color: #160d05;
  background: var(--gold-gradient);
  box-shadow: 0 18px 42px rgba(211,151,55,.26), 0 0 0 1px rgba(23, 19, 16, 0.14) inset;
  font-weight: 900;
}

.reveal {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity .75s ease, transform .75s ease;
}

.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.reveal--delay,
.reveal--delay-md {
  transition-delay: .14s;
}

.reveal--delay-sm {
  transition-delay: .08s;
}

@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-16px) scale(1.01); }
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes sparkle {
  0%, 100% { transform: scale(.6); opacity: .22; }
  50% { transform: scale(1.25); opacity: .86; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}

@media (max-width: 1080px) {
  .site-header {
    border-radius: 32px;
  }

  .main-nav {
    position: fixed;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    display: grid;
    grid-template-columns: 1fr;
    padding: 12px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--line);
    box-shadow: 0 20px 60px rgba(23, 19, 16, 0.21);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: opacity .25s ease, visibility .25s ease, transform .25s ease;
  }

  .main-nav.is-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .main-nav a {
    padding: 14px 16px;
  }

  .menu-toggle {
    display: inline-flex;
  }

  .icon-link {
    display: none;
  }

  .hero__inner,
  .atelier-card,
  .about-grid,
  .contact-card {
    grid-template-columns: 1fr;
  }

  .hero__content {
    text-align: center;
  }

  .hero__lead,
  .hero__facts {
    margin-left: auto;
    margin-right: auto;
  }

  .hero__actions {
    justify-content: center;
  }

  .hero__visual {
    width: min(620px, 100%);
    margin-inline: auto;
  }

  .section-head {
    grid-template-columns: 1fr;
    align-items: start;
  }

  .section-head p:last-child {
    max-width: 720px;
  }

  .collections-grid,
  .products-grid,
  .trust-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .faq-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 760px) {
  .container {
    width: min(100% - 28px, var(--max));
  }

  .site-header {
    width: calc(100% - 20px);
    top: 10px;
    min-height: 68px;
    padding: 8px;
  }

  .brand__logo {
    width: 50px;
    height: 50px;
  }

  .brand__text span {
    font-size: .92rem;
  }

  .brand__text small {
    font-size: .6rem;
  }

  .header-actions .btn {
    display: none;
  }

  .hero {
    padding-top: 118px;
    padding-bottom: 64px;
  }

  .hero h1 {
    font-size: clamp(2.8rem, 14vw, 4.8rem);
  }

  .hero__facts,
  .signature-strip__grid,
  .collections-grid,
  .products-grid,
  .trust-grid,
  .contact-methods,
  .values-grid,
  .footer-grid {
    grid-template-columns: 1fr;
  }

  .hero__visual {
    min-height: 560px;
    border-radius: 32px;
  }

  .hero__logo {
    top: 24px;
    width: 138px;
    height: 138px;
  }

  .hero__jewel {
    width: 112%;
  }

  .floating-card {
    position: relative;
    inset: auto;
    width: calc(100% - 36px);
    margin-top: -86px;
  }

  .floating-card--top {
    display: none;
  }

  .floating-card--bottom {
    right: auto;
    bottom: auto;
  }

  .section {
    padding: 78px 0;
  }

  .collection-card {
    min-height: 350px;
  }

  .about-visual__frame {
    min-height: 420px;
    border-radius: 32px;
  }

  .about-note {
    position: relative;
    right: auto;
    bottom: auto;
    margin: -52px auto 0;
  }

  .atelier-card,
  .contact-card {
    border-radius: 32px;
  }

  .footer-grid p,
  .footer-links {
    text-align: left;
    justify-content: flex-start;
  }

  .footer-bottom {
    flex-direction: column;
    align-items: flex-start;
  }

  .floating-whatsapp {
    right: 14px;
    bottom: 14px;
    min-height: 48px;
    padding-inline: 16px;
  }
}

@media (max-width: 430px) {
  .brand__text {
    display: none;
  }

  .hero__actions .btn {
    width: 100%;
  }

  .product-card__bottom {
    align-items: flex-start;
    flex-direction: column;
  }

  .order-link {
    width: 100%;
    justify-content: center;
  }
}

/* Production pages and expanded catalog */
.main-nav a[aria-current="page"] {
  color: #170e05;
  background: var(--gold-gradient);
  box-shadow: inset 0 1px 0 rgba(23, 19, 16, 0.14);
}

.page-hero {
  position: relative;
  padding: 150px 0 72px;
  overflow: hidden;
}

.page-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 18%, rgba(166, 124, 45, 0.16), transparent 26rem),
    radial-gradient(circle at 78% 40%, rgba(188, 108, 29, .11), transparent 28rem),
    linear-gradient(118deg, transparent 0 47%, rgba(255, 232, 180, .05) 47.2%, transparent 48%);
  pointer-events: none;
}

.page-hero__grid {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(260px, .38fr);
  gap: 40px;
  align-items: center;
}

.page-hero h1,
.product-detail h1,
.info-panel h2 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(3rem, 6vw, 6.4rem);
  letter-spacing: -.05em;
  line-height: .95;
  background: linear-gradient(110deg, #2e2008 0%, #8a6420 38%, #c08f38 62%, #6f4d15 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.page-hero p:not(.eyebrow) {
  max-width: 760px;
  margin: 24px 0 0;
  color: var(--muted);
  font-size: 1.12rem;
  line-height: 1.8;
}

.page-hero__stat,
.page-hero__logo {
  min-height: 310px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 34px;
  background:
    radial-gradient(circle at 50% 35%, rgba(166, 124, 45, 0.18), transparent 15rem),
    rgba(255, 255, 255, 0.74);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(23, 19, 16, 0.066);
}

.page-hero__stat {
  display: grid;
  align-content: center;
  gap: 8px;
}

.page-hero__stat strong {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 4.6rem;
  line-height: .95;
  color: var(--gold-2);
}

.page-hero__stat span {
  margin-bottom: 20px;
  color: var(--muted);
  line-height: 1.55;
}

.page-hero__logo {
  display: grid;
  place-items: center;
}

.page-hero__logo img {
  width: min(260px, 90%);
  border-radius: 50%;
  filter: drop-shadow(0 20px 46px rgba(23, 19, 16, 0.202));
}

.catalog-toolbar {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(190px, .28fr) minmax(180px, .26fr);
  gap: 14px;
  align-items: end;
  margin-bottom: 18px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: inset 0 1px 0 rgba(23, 19, 16, 0.055);
}

.search-field,
.select-field {
  display: grid;
  gap: 8px;
  color: var(--gold-2);
  font-weight: 760;
}

.search-field input,
.select-field select {
  width: 100%;
  min-height: 52px;
  border: 1px solid rgba(166, 124, 45, 0.22);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.061);
  color: var(--text);
  padding: 0 15px;
  outline: none;
}

.select-field option {
  color: #1b1108;
}

.search-field input:focus,
.select-field select:focus {
  border-color: rgba(166, 124, 45, 0.62);
  box-shadow: 0 0 0 4px rgba(166, 124, 45, 0.1);
}

.catalog-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 18px 0 28px;
  color: var(--muted);
}

.catalog-summary span {
  color: var(--gold-2);
  font-weight: 900;
}

.text-button {
  border: 0;
  background: transparent;
  color: var(--gold-2);
  text-decoration: underline;
  text-underline-offset: 4px;
}

.products-grid--large {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.product-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: -8px 0 16px;
}

.product-tags span {
  padding: 6px 9px;
  border-radius: 999px;
  border: 1px solid rgba(166, 124, 45, 0.16);
  color: var(--muted);
  background: rgba(255, 255, 255, 0.039);
  font-size: .78rem;

.product-tags--large {
  margin: 24px 0 26px;
}

.product-tags--large span {
  color: var(--gold-2);
}

.mini-specs {
  display: grid;
  gap: 8px;
  margin: 0 0 18px;
}

.mini-specs div {
  display: grid;
  grid-template-columns: .55fr 1fr;
  gap: 10px;
  padding: 9px 0;
  border-top: 1px solid rgba(23, 19, 16, 0.066);
}

.mini-specs dt {
  color: var(--muted-2);
}

.mini-specs dd {
  margin: 0;
  color: var(--text);
}

.empty-state {
  grid-column: 1 / -1;
  min-height: 260px;
  display: grid;
  place-items: center;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.72);
}

.empty-state h3 {
  margin: 0 0 8px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 2rem;
}

.empty-state p {
  margin: 0;
  color: var(--muted);
}

.full-catalog-cta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin: 0 0 32px;
}

.quote-section {
  padding-top: 48px;
}

.product-detail {
  padding-top: 150px;
}

.product-detail__grid {
  display: grid;

/* Authentication, account, favorites */
.auth-header-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;

  border: 1px solid rgba(166, 124, 45, 0.22);

  color: var(--gold-2);
  font-weight: 800;
  font-size: .9rem;
  transition: transform .2s ease, border-color .2s ease, background .2s ease;
}

.auth-header-link:hover,
.auth-header-link:focus-visible {
  transform: translateY(-1px);
  border-color: rgba(166, 124, 45, 0.48);
  background: rgba(166, 124, 45, 0.075);
}

.auth-header-link__avatar {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold-gradient);
  color: #160d05;
  overflow: hidden;
  font-weight: 900;
}

.auth-header-link__avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.auth-modal {
  position: fixed;
  inset: 0;
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.auth-modal.is-open {
  display: flex;
}

.auth-modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.302);

}

.auth-modal__panel {

}

.auth-modal__close {
  position: absolute;
  right: 18px;
  top: 18px;
  width: 38px;
  height: 38px;
  border-radius: 50%;

}

.auth-modal__brand {
  display: flex;
  align-items: center;

}

.auth-modal__brand img {

  height: 70px;

}

.auth-modal__brand span,
.auth-modal__brand small {
  display: block;
}

.auth-modal__brand span {

}

.auth-modal__brand small {
  margin-top: 4px;

}

.auth-modal h2,
.account-panel h2,
.account-profile h2 {

}

.auth-modal p,
.account-panel p {

}

.auth-modal__buttons,
.account-actions {

.auth-provider-btn {

.auth-provider-btn:hover {

.auth-message {

.favorite-btn {

  background: rgba(255, 255, 255, .78);

  font-size: 1.28rem;

.favorite-btn:hover,

.product-card {
  position: relative;
}

.product-card__favorite {
  position: absolute;
  right: 16px;
  top: 16px;
  z-index: 5;
}

.favorite-detail-btn {
  gap: 8px;
}

.account-section-page {
  padding-top: 40px;
}

.account-panel,
.account-dashboard,
.account-profile,
.account-section,
.account-item,
.account-stats div {

}

.account-panel,
.account-dashboard {

}

.account-panel code {

}

.account-profile {
  display: grid;
  grid-template-columns: 96px 1fr auto;

}

.account-profile img {
  width: 96px;
  height: 96px;
  border-radius: 50%;

}

.account-profile p {

}

.account-stats {

  grid-template-columns: repeat(3, minmax(0, 1fr));

}

.account-stats div {

}

.account-stats strong {

.account-stats span {

.account-section__head a,

.account-item h4 {

.account-item p,
.account-item small,

.order-status {

.empty-account-state {

@media (max-width: 1080px) {

  .account-stats {

@media (max-width: 760px) {

  .auth-header-link [data-auth-link-text] {

  .account-profile {
    grid-template-columns: 1fr;

  }
  .account-item {
    grid-template-columns: 72px 1fr;
  }
  .account-item .favorite-btn {
    grid-column: 1 / -1;
    justify-self: start;
  }

/* ===== Official Google Sign-In button (Google Identity branding) ===== */
.gsi-material-button {
  -moz-user-select: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-appearance: none;
  appearance: none;
  background-color: #fff;
  background-image: none;
  border: 1px solid #747775;
  border-radius: 20px;
  box-sizing: border-box;
  color: #ffffff;
  cursor: pointer;
  font-family: 'Roboto', 'Inter', Arial, sans-serif;
  font-size: 14px;
  height: 40px;
  letter-spacing: 0.25px;
  outline: none;
  overflow: hidden;
  padding: 0 12px;
  position: relative;
  text-align: center;
  transition: background-color .218s, border-color .218s, box-shadow .218s;
  vertical-align: middle;
  white-space: nowrap;
  width: 100%;
  max-width: 400px;
  min-width: min(100%, 240px);
}
.gsi-material-button .gsi-material-button-icon {
  height: 20px;
  margin-right: 12px;
  min-width: 20px;
  width: 20px;
}
.gsi-material-button .gsi-material-button-icon svg { display: block; width: 100%; height: 100%; }
.gsi-material-button .gsi-material-button-content-wrapper {
  align-items: center;
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  height: 100%;
  justify-content: space-between;
  position: relative;
  width: 100%;
}
.gsi-material-button .gsi-material-button-contents {
  flex-grow: 1;
  font-family: 'Roboto', 'Inter', Arial, sans-serif;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: top;
  color: #ffffff;
}
.gsi-material-button .gsi-material-button-state {
  transition: opacity .218s;
  bottom: 0; left: 0; opacity: 0; position: absolute; right: 0; top: 0;
}
.gsi-material-button:disabled { cursor: default; background-color: #ffffff61; border-color: #ffffff1f; }
.gsi-material-button:disabled .gsi-material-button-contents { opacity: 38%; }
.gsi-material-button:disabled .gsi-material-button-icon { opacity: 38%; }
.gsi-material-button:not(:disabled):active .gsi-material-button-state,
.gsi-material-button:not(:disabled):focus .gsi-material-button-state { background-color: #f0ece5; opacity: 12%; }
.gsi-material-button:not(:disabled):hover { box-shadow: 0 1px 2px 0 rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15); }
.gsi-material-button:not(:disabled):hover .gsi-material-button-state { background-color: #f0ece5; opacity: 8%; }
.auth-modal__buttons .gsi-material-button { margin: 0 auto; }
.account-panel .gsi-material-button { margin-right: 10px; }

/* ===================== Auth v2: gate, header profile, language ===================== */

.gsi-material-button {
  width: 100%;
  max-width: 320px;
  min-width: 0;
  height: 44px;
  padding: 0 14px;

.gsi-material-button .gsi-material-button-contents {

  overflow: hidden;
  text-overflow: ellipsis;
}
@media (max-width: 420px) {

/* --- header auth slot + language switch --- */
.header-actions { gap: 10px; }
.auth-slot { display: flex; align-items: center; }
.auth-signin-btn { white-space: nowrap; }

.lang-switch {
  display: inline-flex;
  padding: 3px;
  border-radius: 999px;
  border: 1px solid rgba(166, 124, 45, 0.35);
  background: rgba(255, 255, 255, .55);
  backdrop-filter: blur(6px);
}
.lang-switch button {
  border: 0;
  background: transparent;
  color: rgba(23, 19, 16, 0.72);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  padding: 5px 10px;
  border-radius: 999px;
  cursor: pointer;
  transition: background .2s, color .2s;
  line-height: 1;
}
.lang-switch button:hover { color: #171310; }
.lang-switch button.is-active {
  background: linear-gradient(135deg, #a87c2d, #8a6420);
  color: #171310;
}

/* --- user chip + dropdown --- */
.user-menu { position: relative; }
.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 5px 12px 5px 5px;
  border-radius: 999px;
  border: 1px solid rgba(166, 124, 45, 0.38);
  background: rgba(255, 255, 255, .72);
  color: #171310;
  cursor: pointer;
  font: inherit;
  font-size: 14px;
  max-width: 190px;
  transition: border-color .2s, box-shadow .2s, transform .2s;
}
.user-chip:hover { border-color: rgba(166, 124, 45, 0.8); box-shadow: 0 6px 20px rgba(23, 19, 16, 0.147); }
.user-chip__avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  overflow: hidden;
  display: grid; place-items: center;
  background: linear-gradient(135deg, #a87c2d, #8a6a2d);
  color: #15120d;
  font-weight: 700;
  font-size: 13px;
  flex: none;
}
.user-chip__avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.user-chip__avatar--lg { width: 44px; height: 44px; font-size: 17px; }
.user-chip__name {
  max-width: 96px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}
.user-chip__caret {
  width: 7px; height: 7px;
  border-right: 2px solid rgba(166, 124, 45, 0.85);
  border-bottom: 2px solid rgba(166, 124, 45, 0.85);
  transform: rotate(45deg) translateY(-2px);
  flex: none;
  transition: transform .2s;
}
.user-menu.is-open .user-chip__caret { transform: rotate(225deg) translateY(-2px); }

.user-dropdown {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  min-width: 248px;
  padding: 10px;
  border-radius: 16px;
  border: 1px solid rgba(166, 124, 45, 0.28);
  background: linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(255, 255, 255, .98));
  box-shadow: 0 24px 60px rgba(23, 19, 16, 0.231);
  display: grid;
  gap: 2px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition: opacity .18s, transform .18s, visibility .18s;
  z-index: 70;
}
.user-menu.is-open .user-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
.user-dropdown__head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px 14px;
  border-bottom: 1px solid rgba(166, 124, 45, 0.18);
  margin-bottom: 6px;
}
.user-dropdown__head strong {
  display: block;
  font-size: 14px;
  color: #171310;
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.user-dropdown__head small {
  display: block;
  font-size: 12px;
  color: rgba(23, 19, 16, 0.55);
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.user-dropdown a,
.user-dropdown button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 11px 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: rgba(23, 19, 16, 0.88);
  font: inherit;
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
  transition: background .18s, color .18s;
}
.user-dropdown a:hover,
.user-dropdown button:hover { background: rgba(166, 124, 45, 0.14); color: #8a6420; }
.user-dropdown button[data-auth-logout] { color: rgba(240, 150, 140, .9); }

/* --- full-screen auth gate --- */
body.auth-locked { overflow: hidden; }
body.auth-locked .site-header,
body.auth-locked main,
body.auth-locked .site-footer { filter: blur(7px) saturate(.7); pointer-events: none; user-select: none; }

.auth-gate {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px 18px;
}
.auth-gate.is-open { display: flex; }
.auth-gate__bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(1000px 520px at 20% 10%, rgba(166, 124, 45, 0.16), transparent 60%),
    radial-gradient(800px 460px at 85% 85%, rgba(166, 124, 45, 0.1), transparent 60%),
    rgba(255, 255, 255, .93);
  backdrop-filter: blur(10px);
}
.auth-gate__panel {
  position: relative;
  width: min(460px, 100%);
  max-height: calc(100dvh - 40px);
  overflow-y: auto;
  padding: clamp(26px, 5vw, 40px) clamp(20px, 4.5vw, 36px) clamp(22px, 4vw, 32px);
  border-radius: 24px;
  border: 1px solid rgba(166, 124, 45, 0.3);
  background: linear-gradient(180deg, rgba(255, 255, 255, .97), rgba(255, 255, 255, .99));
  box-shadow: 0 40px 120px rgba(23, 19, 16, 0.294), inset 0 1px 0 rgba(23, 19, 16, 0.055);
  text-align: center;
  animation: gateIn .45s cubic-bezier(.2, .8, .3, 1);
}
@keyframes gateIn {
  from { opacity: 0; transform: translateY(18px) scale(.97); }
  to { opacity: 1; transform: none; }
}
.auth-gate__brand img {
  width: clamp(78px, 18vw, 104px);
  height: auto;
  border-radius: 50%;
  border: 1px solid rgba(166, 124, 45, 0.35);
  box-shadow: 0 14px 40px rgba(23, 19, 16, 0.231);
}
.auth-gate__eyebrow {
  margin: 16px 0 6px;
  font-size: 11px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: rgba(166, 124, 45, 0.85);
}
.auth-gate__panel h2 {
  margin: 0 0 12px;
  font-size: clamp(20px, 3.4vw, 27px);
  line-height: 1.22;
  color: #ffffff;
}
.auth-gate__text {
  margin: 0 auto 22px;
  max-width: 36ch;
  font-size: clamp(13.5px, 1.6vw, 15px);
  line-height: 1.65;
  color: rgba(23, 19, 16, 0.72);
}
.auth-gate__action { display: flex; justify-content: center; }
.auth-gate__note {
  margin: 14px 0 0;
  font-size: 12px;
  line-height: 1.55;
  color: rgba(23, 19, 16, 0.14);
}
.auth-gate__langs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid rgba(166, 124, 45, 0.16);
}
.auth-gate__langs button {
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid rgba(166, 124, 45, 0.3);
  background: transparent;
  color: rgba(23, 19, 16, 0.7);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.auth-gate__langs button:hover { border-color: rgba(166, 124, 45, 0.7); color: #8a6420; }
.auth-gate__langs button.is-active {
  background: linear-gradient(135deg, #a87c2d, #8a6420);
  border-color: transparent;
  color: #171310;
  font-weight: 600;
}
.auth-gate.is-checking .auth-gate__action { opacity: .45; pointer-events: none; }
.auth-gate .auth-message { margin: 14px 0 0; font-size: 13px; min-height: 18px; }
.auth-gate .auth-message[data-tone="error"] { color: #b4402c; }
.auth-gate .auth-message[data-tone="warning"] { color: #e8c877; }
.auth-gate .auth-message[data-tone="info"] { color: rgba(23, 19, 16, 0.55); }

/* --- language dialog after login --- */
.lang-dialog {
  position: fixed;
  inset: 0;
  z-index: 210;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.lang-dialog.is-open { display: flex; }
.lang-dialog__backdrop { position: absolute; inset: 0; background: rgba(255, 255, 255, .82); backdrop-filter: blur(8px); }
.lang-dialog__panel {
  position: relative;
  width: min(430px, 100%);
  padding: clamp(26px, 5vw, 36px);
  border-radius: 22px;
  border: 1px solid rgba(166, 124, 45, 0.3);
  background: linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(255, 255, 255, .99));
  box-shadow: 0 36px 100px rgba(23, 19, 16, 0.273);
  text-align: center;
  animation: gateIn .4s cubic-bezier(.2, .8, .3, 1);
}
.lang-dialog__mark { color: #a87c2d; font-size: 20px; letter-spacing: .3em; }
.lang-dialog__panel h3 { margin: 10px 0 4px; font-size: clamp(18px, 2.6vw, 22px); color: #ffffff; }
.lang-dialog__panel > p { margin: 0 0 22px; font-size: 14px; color: rgba(23, 19, 16, 0.6); }
.lang-dialog__options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lang-dialog__options button {
  display: grid;
  gap: 4px;
  padding: 18px 12px;
  border-radius: 16px;
  border: 1px solid rgba(166, 124, 45, 0.28);
  background: rgba(255, 255, 255, 0.033);
  color: #171310;
  font: inherit;
  cursor: pointer;
  transition: transform .18s, border-color .18s, background .18s;
}
.lang-dialog__options button:hover {
  transform: translateY(-2px);
  border-color: rgba(166, 124, 45, 0.75);
  background: rgba(166, 124, 45, 0.1);
}
.lang-dialog__options strong { font-size: 17px; }
.lang-dialog__options small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(23, 19, 16, 0.5); }
@media (max-width: 380px) {
  .lang-dialog__options { grid-template-columns: 1fr; }
}

/* ===================== Desktop / mobile polish ===================== */
@media (min-width: 1081px) {
  .site-header { gap: 20px; }
  .main-nav { gap: clamp(14px, 1.6vw, 28px); }
  .header-actions .icon-link { white-space: nowrap; }
}
@media (max-width: 1180px) {
  .user-chip__name { max-width: 74px; }
}
@media (max-width: 1080px) {
  .lang-switch button { padding: 5px 8px; font-size: 10px; }
  .user-chip { max-width: 150px; padding-right: 10px; }
}
@media (max-width: 760px) {
  .header-actions { gap: 8px; }
  .header-actions .icon-link { display: none; }
  .user-chip__name { display: none; }
  .user-chip { padding: 4px; gap: 0; }
  .user-chip__caret { display: none; }
  .user-dropdown { right: -4px; min-width: min(78vw, 270px); }
  .auth-signin-btn { padding: 8px 14px; font-size: 13px; }
  .auth-gate__panel { border-radius: 20px; }
}
@media (max-width: 430px) {
  .lang-switch { padding: 2px; }
  .lang-switch button { padding: 5px 7px; }
  .auth-gate { padding: 14px 12px; }
  .auth-gate__panel { padding: 24px 18px 20px; }
}

/* ===== Auth v3: no-flash loading states, skeletons ===== */
body.auth-pending main,
body.auth-pending .site-footer { opacity: .35; transition: opacity .25s; pointer-events: none; }
body.auth-pending .site-header { opacity: .6; }

.account-panel--loading { text-align: center; padding: clamp(28px, 6vw, 52px); }
.account-loading-text { color: rgba(23, 19, 16, 0.55); font-size: 14px; margin-top: 18px; }
.account-skeleton { display: grid; justify-items: center; gap: 14px; }
.sk {
  display: block;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.055) 25%, rgba(166, 124, 45, 0.14) 37%, rgba(255, 255, 255, 0.055) 63%);
  background-size: 400% 100%;
  animation: skshine 1.3s ease-in-out infinite;
  border-radius: 10px;
}
.sk--avatar { width: 72px; height: 72px; border-radius: 50%; }
.sk--line { width: 220px; height: 14px; }
.sk--wide { width: 300px; max-width: 80%; height: 20px; }
.sk--row { width: 100%; height: 76px; border-radius: 14px; }
.account-items--pending { display: grid; gap: 12px; }
@keyframes skshine { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

/* ============ v4 fixes: logo alignment, mobile taps, favorites feedback ============ */

/* --- logo: the emblem is a perfect centered circle, so fill the circle exactly --- */
.brand__logo,
.footer-brand img,
.auth-gate__brand img,
.auth-modal__brand img,
.account-avatar {
  object-fit: cover !important;
  object-position: center center !important;
  aspect-ratio: 1 / 1;
  display: block;
}

/* large decorative logos keep their frame and are never cropped */
.hero__logo,
.page-hero__logo img,
.about-visual__frame img {
  object-fit: contain !important;
  object-position: center center !important;
}
.brand__logo {
  width: 56px;
  height: 56px;
  flex: 0 0 56px;
  border-radius: 50%;
  overflow: hidden;
}
.auth-gate__brand {
  display: flex;
  justify-content: center;
}
.auth-gate__brand img {
  width: clamp(84px, 20vw, 108px);
  height: clamp(84px, 20vw, 108px);
  border-radius: 50%;
  margin: 0 auto;
}
.auth-modal__brand img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
}
.footer-brand img { width: 44px; height: 44px; border-radius: 50%; }
@media (max-width: 760px) {
  .brand__logo { width: 46px; height: 46px; flex-basis: 46px; }
}
@media (max-width: 430px) {
  .brand__logo { width: 42px; height: 42px; flex-basis: 42px; }
}

/* --- touch devices: no hover states (they cause the "first tap does nothing" bug) --- */
@media (hover: none) {
  .product-card:hover { transform: none; }
  .product-card:hover .product-card__media img { transform: none; }
  .product-card:hover .product-card__media::after { transform: translateX(-120%); }
  .favorite-btn:hover { transform: none; background: rgba(255, 255, 255, .78); color: var(--gold-2); }
  .favorite-btn.is-active:hover { background: var(--gold-gradient); color: #160d05; }
  .user-chip:hover { box-shadow: none; }
  .gsi-material-button:not(:disabled):hover { box-shadow: none; }
}

/* --- make the whole card media reliably tappable --- */
.product-card__media { display: block; -webkit-tap-highlight-color: transparent; }
.product-card__media::after { pointer-events: none; }
.product-card__media img { pointer-events: none; }
.product-card h3 a { display: inline-block; padding: 2px 0; }
.product-card__favorite { touch-action: manipulation; }
.cursor-glow { pointer-events: none !important; }

/* --- favourite star: clear visual state + pulse --- */
.favorite-btn {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  will-change: transform;
}
.favorite-btn.is-active {
  background: var(--gold-gradient);
  color: #160d05;
  border-color: rgba(166, 124, 45, 0.85);
  box-shadow: 0 10px 28px rgba(219, 156, 60, .38);
}
.favorite-btn.is-pulsing { animation: favPulse .42s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes favPulse {
  0% { transform: scale(1); }
  45% { transform: scale(1.28); }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) { .favorite-btn.is-pulsing { animation: none; } }

/* --- toast: small notification at the top, visible on every screen --- */
.auth-toast {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  left: 50%;
  right: auto;
  bottom: auto;
  transform: translate(-50%, -16px);
  display: flex;
  align-items: center;
  gap: 10px;
  width: max-content;
  max-width: min(92vw, 420px);
  padding: 11px 18px 11px 14px;
  border-radius: 999px;
  border: 1px solid rgba(166, 124, 45, 0.34);
  background: rgba(255, 255, 255, .96);
  box-shadow: 0 18px 44px rgba(23, 19, 16, 0.231);
  backdrop-filter: blur(8px);
  font-size: 14px;
  z-index: 5000;
}
.auth-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
.auth-toast__icon {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--gold-gradient);
  color: #160d05;
  font-size: 13px;
  font-weight: 900;
  flex: none;
}
.auth-toast[data-tone="error"] .auth-toast__icon { background: linear-gradient(135deg, #e86a5c, #b4402c); color: #fff; }
.auth-toast[data-tone="warning"] .auth-toast__icon { background: linear-gradient(135deg, #e8b14f, #f3d68a); }
.auth-toast[data-tone="info"] .auth-toast__icon { background: rgba(166, 124, 45, 0.22); color: var(--gold-2); }
.auth-toast__text { line-height: 1.35; }
@media (max-width: 430px) {
  .auth-toast { font-size: 13px; padding: 10px 14px 10px 11px; }
}

/* ======================= LIVE GOLD & SILVER RATES =======================
   A slim price strip under the header: always open, candlestick chart on
   demand. Sized to inform without competing with the hero.                 */
.rate-section { padding: 104px 0 0; }
@media (max-width: 720px) { .rate-section { padding-top: 92px; } }

.rate-board {
  --rb-ink: #171310;
  --rb-muted: #6d6254;
  --rb-line: rgba(23, 19, 16, 0.1);
  --rb-up: #157f3c;
  --rb-down: #b4402c;
  position: relative;
  border-radius: var(--radius-md);
  padding: clamp(14px, 1.8vw, 20px) clamp(16px, 2vw, 24px);
  overflow: hidden;
  color: var(--rb-ink);
  background: linear-gradient(180deg, #ffffff 0%, #fcfaf7 100%);
  box-shadow: 0 10px 28px rgba(23, 19, 16, 0.07), 0 0 0 1px rgba(166, 124, 45, 0.22);
}
.rate-board::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
  background: var(--gold-gradient);
}
.rate-board__head {
  display: flex; flex-wrap: wrap; gap: 10px 16px;
  align-items: center; justify-content: space-between;
}
.rate-board__eyebrow {
  margin: 0 0 2px; font-size: 0.6rem; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--gold-3);
}
.rate-board__head h2 {
  margin: 0; font-size: clamp(1rem, 1.6vw, 1.22rem); color: var(--rb-ink);
  font-family: inherit; letter-spacing: -0.01em;
}
.rate-board__tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rate-clock {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px; border-radius: 999px;
  border: 1px solid var(--rb-line); background: #fff;
  font-size: 0.84rem; font-variant-numeric: tabular-nums; color: var(--rb-ink);
}
.rate-clock__dot {
  width: 6px; height: 6px; border-radius: 50%; background: #1faa52;
  box-shadow: 0 0 8px rgba(31, 170, 82, 0.5); animation: ratePulse 1.8s infinite;
}
@keyframes ratePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.rate-switch {
  display: inline-flex; border: 1px solid var(--rb-line);
  border-radius: 999px; overflow: hidden; background: #fff;
}
.rate-switch button {
  min-width: 48px; padding: 6px 11px; border: 0; cursor: pointer;
  background: transparent; color: var(--rb-muted); font-size: 0.8rem; font-weight: 600;
  letter-spacing: 0.04em; transition: background 0.25s ease, color 0.25s ease;
}
.rate-switch button:hover { color: var(--rb-ink); }
.rate-switch button.is-active { background: var(--gold-gradient); color: #1a1208; }
.rate-chart-toggle {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(166, 124, 45, 0.4); background: #fff; color: var(--rb-ink);
  font-size: 0.8rem; font-weight: 600;
  transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
}
.rate-chart-toggle:hover { border-color: rgba(166, 124, 45, 0.75); }
.rate-chart-toggle.is-active { background: var(--gold-gradient); color: #1a1208; border-color: transparent; }
.rate-chart-toggle__icon { font-size: 0.85rem; line-height: 1; }

/* ---- always-visible price strip ---- */
.rate-highlight {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 22px;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rb-line);
}
.rate-highlight__card { display: flex; align-items: baseline; gap: 8px; }
.rate-highlight__label {
  font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--rb-muted);
}
.rate-highlight__value {
  font-size: clamp(1.05rem, 2vw, 1.3rem); font-weight: 700;
  font-variant-numeric: tabular-nums; color: var(--rb-ink);
}
.rate-highlight__delta { font-size: 0.8rem; font-weight: 600; }
.rate-highlight__delta.is-up, .rate-chart__legend .is-up { color: var(--rb-up); }
.rate-highlight__delta.is-down, .rate-chart__legend .is-down { color: var(--rb-down); }
.rate-highlight__delta.is-flat { color: var(--rb-muted); }
.rate-highlight__live {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-3);
}
.rate-highlight__live::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: #1faa52; animation: ratePulse 1.8s infinite;
}

/* ---- candlestick chart ---- */
.rate-chart {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rb-line);
  animation: rateChartIn 0.35s ease;
}
.rate-chart.is-hidden { display: none; }
@keyframes rateChartIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.rate-chart__head {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 8px;
}
.rate-chart__head h3 { margin: 0; font-size: 0.84rem; font-weight: 600; color: var(--rb-muted); }
.rate-chart__range { display: inline-flex; gap: 6px; }
.rate-chart__range button {
  padding: 4px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rb-line); background: #fff; color: var(--rb-muted); font-size: 0.74rem;
  transition: border-color 0.2s ease, color 0.2s ease;
}
.rate-chart__range button.is-active { border-color: rgba(166, 124, 45, 0.6); color: var(--gold-3); font-weight: 600; }
.rate-chart__canvas {
  position: relative; height: clamp(130px, 16vw, 170px);
  border: 1px solid var(--rb-line); border-radius: var(--radius-sm);
  background: #fff; overflow: hidden;
}
.rate-chart__canvas svg { width: 100%; height: 100%; display: block; }
.rate-chart__grid { stroke: rgba(23, 19, 16, 0.07); stroke-width: 1; }
.rate-candle line { stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.rate-candle.is-up line, .rate-candle.is-up rect { stroke: var(--rb-up); }
.rate-candle.is-up rect { fill: var(--rb-up); fill-opacity: 0.9; }
.rate-candle.is-down line, .rate-candle.is-down rect { stroke: var(--rb-down); }
.rate-candle.is-down rect { fill: var(--rb-down); fill-opacity: 0.9; }
.rate-candle rect { stroke-width: 1; vector-effect: non-scaling-stroke; }
.rate-chart__max, .rate-chart__min {
  position: absolute; right: 10px; font-size: 0.7rem;
  font-variant-numeric: tabular-nums; color: var(--rb-muted);
  background: rgba(255, 255, 255, 0.85); padding: 1px 6px; border-radius: 6px;
}
.rate-chart__max { top: 6px; }
.rate-chart__min { bottom: 6px; }
.rate-chart__empty {
  margin: 0; height: 100%; display: flex; align-items: center; justify-content: center;
  color: var(--rb-muted); font-size: 0.84rem;
}
.rate-chart__legend { margin: 7px 0 0; font-size: 0.76rem; color: var(--rb-muted); }

/* ---- table ---- */
.rate-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 12px; }
.rate-table { width: 100%; border-collapse: collapse; min-width: 480px; }
.rate-table thead th {
  text-align: right; padding: 0 12px 8px; font-size: 0.64rem;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--rb-muted); font-weight: 600; white-space: nowrap;
}
.rate-table thead th:first-child, .rate-table thead th:nth-child(2) { text-align: left; }
.rate-table tbody tr { border-top: 1px solid var(--rb-line); }
.rate-table tbody tr.is-featured { background: rgba(166, 124, 45, 0.06); }
.rate-table td, .rate-table tbody th {
  padding: 8px 12px; text-align: right; font-variant-numeric: tabular-nums;
  font-size: 0.9rem; color: var(--rb-ink); white-space: nowrap;
}
.rate-table tbody th { text-align: left; font-weight: 600; }
.rate-purity { display: block; font-size: 0.92rem; color: var(--gold-3); font-weight: 700; }
.rate-metal { display: block; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rb-muted); }
.rate-karat { text-align: left !important; color: var(--rb-muted); font-size: 0.82rem; }
.rate-sell { font-weight: 700; border-radius: 6px; }
.rate-sell.is-flash-up { animation: rateFlashUp 1.4s ease-out; }
.rate-sell.is-flash-down { animation: rateFlashDown 1.4s ease-out; }
@keyframes rateFlashUp {
  0% { background: rgba(21, 127, 60, 0.22); color: #157f3c; }
  100% { background: transparent; color: var(--rb-ink); }
}
@keyframes rateFlashDown {
  0% { background: rgba(180, 64, 44, 0.2); color: #b4402c; }
  100% { background: transparent; color: var(--rb-ink); }
}
.rate-change { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.rate-change small { font-size: 0.66rem; opacity: 0.85; }
.rate-change.is-up { color: var(--rb-up); }
.rate-change.is-down { color: var(--rb-down); }
.rate-change.is-flat { color: var(--rb-muted); }
.rate-skeleton td { text-align: center; color: var(--rb-muted); padding: 20px 12px; }

/* ---- footer ---- */
.rate-board__foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px;
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rb-line);
}
.rate-board__meta {
  display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0;
  color: var(--rb-muted); font-size: 0.74rem;
}
.rate-board__stamp strong { color: var(--rb-ink); font-weight: 600; }
.rate-board__legal { margin: 0; flex: 1 1 280px; color: var(--rb-muted); font-size: 0.7rem; line-height: 1.45; }
.rate-board__status:empty { display: none; }
.rate-board__status { margin: 10px 0 0; color: var(--rb-down); font-size: 0.8rem; text-align: center; }
@media (max-width: 720px) {
  .rate-board__head { align-items: flex-start; }
  .rate-board__tools { width: 100%; }
  .rate-highlight__live { margin-left: 0; }
}

/* Armenian labels are longer than the Russian ones — keep the header on one line */
html[lang="hy"] .site-header { gap: 10px; padding-right: 10px; }
html[lang="hy"] .site-nav { gap: 2px; }
html[lang="hy"] .site-nav a { font-size: 0.88rem; padding-left: 11px; padding-right: 11px; }
html[lang="hy"] .header-actions { gap: 8px; }
html[lang="hy"] .header-actions .btn { padding-left: 16px; padding-right: 16px; font-size: 0.86rem; }
