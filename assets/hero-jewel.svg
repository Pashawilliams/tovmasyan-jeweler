    <path d="M732 431 L740 456 L766 464 L740 472 L732 498 L724 472 L698 464 L724 456 Z" opacity=".65"/>
    <circle cx="282" cy="492" r="5"/>
    <circle cx="613" cy="126" r="4"/>
